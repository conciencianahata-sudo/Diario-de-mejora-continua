<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Diario del 1%</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de trabajo (máx. 760px), barra de pestañas fija arriba, tarjetas solo donde hay una acción. */
:root{
  --bg:#F5F5F9; --surface:#FFFFFF; --ink:#191A2E; --muted:#5E6078; --line:#DEDFEA;
  --accent:#3A3DA8; --accent-ink:#FFFFFF; --accent-soft:#E6E7F8;
  --good:#1E7B54; --good-soft:#DDF1E7; --warn:#9A6208; --warn-soft:#FBEFD5; --bad:#B23A3A;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif; --text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12131F; --surface:#1B1C2C; --ink:#ECEDF7; --muted:#A3A5BE; --line:#2E3045;
  --accent:#9B9EF2; --accent-ink:#12131F; --accent-soft:#2A2C50;
  --good:#5FCB9A; --good-soft:#18362A; --warn:#E9B35A; --warn-soft:#3A2E14; --bad:#F08A8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131F; --surface:#1B1C2C; --ink:#ECEDF7; --muted:#A3A5BE; --line:#2E3045;
  --accent:#9B9EF2; --accent-ink:#12131F; --accent-soft:#2A2C50;
  --good:#5FCB9A; --good-soft:#18362A; --warn:#E9B35A; --warn-soft:#3A2E14; --bad:#F08A8A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--text);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:14px 0 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:10px}
.brand .sub{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs a{padding:10px 14px;font-weight:600;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
main{display:flex;flex-direction:column;gap:20px;padding-top:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.stat b{font:700 24px/1.1 var(--display)}
.lvl{font:700 28px/1 var(--display);color:var(--accent)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
button,.btn{font:600 14px var(--text);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{border-color:transparent;color:var(--muted);padding:6px 8px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}
label.f small{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=date],input[type=number],textarea,select{font:400 15px var(--text);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:8px 13px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;background:var(--bg)}
.seg input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
form.f section{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
form.f section:first-of-type{border-top:0;padding-top:0}
.step{display:flex;gap:10px;align-items:baseline}
.step i{font:700 12px var(--display);font-style:normal;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;letter-spacing:.04em}
.only-skip{display:none}
form[data-status="skipped"] .only-skip{display:flex}
form[data-status="skipped"] .only-did{display:none}
.banner{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.example{border:1px dashed var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:3px;background:var(--accent-soft)}
.heat i[data-n="1"]{background:var(--accent);opacity:.55}
.heat i[data-n="2"]{background:var(--accent)}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 24px;gap:10px;align-items:center;font-size:13px}
.bar span.t{height:10px;border-radius:5px;background:var(--accent)}
.hist{display:flex;flex-direction:column}
.hist .item{display:flex;gap:12px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.hist .item>div{min-width:0;overflow-wrap:anywhere}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw}
svg text{fill:var(--muted);font:12px var(--text)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
@media (max-width:480px){h1{font-size:25px}.bar{grid-template-columns:90px 1fr 22px}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Diario del 1%</h1>
      <span class="sub" id="syncnote">Cargando…</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones">
      <a href="#hoy" data-v="hoy">Hoy</a>
      <a href="#tareas" data-v="tareas">Mis tareas</a>
      <a href="#progreso" data-v="progreso">Progreso</a>
      <a href="#metodo" data-v="metodo">Método</a>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dstr(new Date());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return dstr(d)};
const fmt=s=>parse(s).toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const MUDAS=[["","Ninguna que haya notado"],["espera","Espera (tiempo muerto antes de empezar o entre pasos)"],["movimiento","Movimiento (buscar cosas, ir y venir)"],["transporte","Transporte (cambiar de lugar o de herramienta sin necesidad)"],["defectos","Defectos (rehacer lo que salió mal)"],["procesamiento","Procesamiento extra (hacer más pasos de los necesarios)"],["inventario","Inventario (pendientes acumulados)"],["sobreproduccion","Sobreproducción (hacer más de lo que hacía falta)"]];
const mudaName=k=>(MUDAS.find(m=>m[0]===k)||["",""])[1].split(" (")[0];
const FACTOR={si:1.01,parcial:1.005,no:1};

/* ---------- estado ---------- */
let tasks=[],entries=[],view="hoy",formTask=null,showArchived=false,editTask=null,chartTask=null,confirmKey=null;
let db=null,base=null,loaded=false,logSave=null;

/* ---------- persistencia: db privada del usuario + copia local ---------- */
const LS="diario1pct.v1";
function lsRead(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j){tasks=j.tasks||[];entries=j.entries||[]}}catch(e){}}
function lsWrite(){try{localStorage.setItem(LS,JSON.stringify({tasks,entries}))}catch(e){}}
function note(t){$("#syncnote").textContent=t}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
async function put(col,obj){
  lsWrite();
  if(!base)return;
  try{await base.collection(col).doc(obj.id).set(obj)}catch(e){note("No se pudo guardar en tu cuenta");}
}
async function del(col,id){lsWrite();if(!base)return;try{await base.collection(col).doc(id).delete()}catch(e){}}
async function boot(){
  lsRead();
  render();
  let timer=setTimeout(()=>{if(!loaded){note("Sin conexión con tu cuenta: usando este navegador");loaded=true}},10000);
  try{
    if(!window.claude||!window.claude.use)throw 0;
    const user=await window.claude.use("user");
    const id=user?await user.id():null;
    db=await window.claude.use("db");
    if(!db||!id)throw 0;
    base=db.doc("data/users/"+id+"/diario");
    note("Guardado en tu cuenta");
    base.collection("tareas").onSnapshot(s=>{tasks=s.docs.map(d=>JSON.parse(JSON.stringify(d.data())));loaded=true;clearTimeout(timer);lsWrite();soft()},()=>note("Sin conexión con tu cuenta"));
    base.collection("entradas").onSnapshot(s=>{entries=s.docs.map(d=>JSON.parse(JSON.stringify(d.data())));lsWrite();soft()},()=>{});
  }catch(e){base=null;note("Guardado solo en este navegador");}
}
function soft(){if(view!=="form"&&!editTask)render()}

/* ---------- cálculos ---------- */
const eOf=id=>entries.filter(e=>e.taskId===id).sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
function levels(id){let v=1;return eOf(id).map(e=>{v*=FACTOR[e.worked]&&e.status!=="skipped"?FACTOR[e.worked]:1;return {e,v}})}
function level(id){const l=levels(id);return l.length?l[l.length-1].v:1}
function streak(id){
  const days=new Set(eOf(id).filter(e=>e.status!=="skipped").map(e=>e.date));
  let d=today(),n=0;
  if(!days.has(d))d=addDays(d,-1);
  while(days.has(d)){n++;d=addDays(d,-1)}
  return n;
}
const act=()=>tasks.filter(t=>!t.archived).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const x=n=>"×"+n.toFixed(3);
const fm=n=>(Math.round(n*10)/10).toString().replace(".",",");
function timeStats(id){
  const a=eOf(id).filter(e=>e.status==="done"&&e.minutes>0);
  if(!a.length)return null;
  const m=a.map(e=>e.minutes),first=m[0],last=m[m.length-1];
  return {n:m.length,first,last,best:Math.min(...m),avg:m.reduce((s,v)=>s+v,0)/m.length,pct:m.length>1?Math.round(100*(last-first)/first):0,list:a};
}
const sgn=p=>(p>0?"+":p<0?"−":"")+Math.abs(p)+" %";
function timeLine(id){
  const s=timeStats(id);if(!s)return "";
  return `<div class="small"><span class="label">Tiempo</span><br>${s.n>1?`Primera vez ${fm(s.first)} min → última ${fm(s.last)} min <span class="pill ${s.pct<=0?"good":"warn"}">${sgn(s.pct)}</span>`:`Última vez: ${fm(s.last)} min. Registra otra vez para comparar.`}</div>`;
}
function timeHint(id){
  const s=timeStats(id);
  return s?`La última vez fueron ${fm(s.last)} min. Solo se comparan las veces completas, no la versión de 2 minutos.`:"Sirve para comparar después. Solo se comparan las veces completas, no la versión de 2 minutos.";
}
function timeChart(list){
  if(list.length<2)return `<p class="muted small">Con dos registros completos o más aparece la línea del tiempo.</p>`;
  const W=640,H=220,m={l:46,r:16,t:14,b:30};
  const maxv=Math.max(...list.map(e=>e.minutes))*1.1;
  const X=i=>m.l+(W-m.l-m.r)*(i/(list.length-1));
  const Y=v=>H-m.b-(H-m.t-m.b)*(v/maxv);
  const pts=list.map((e,i)=>[X(i),Y(e.minutes)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  const ticks=[0,maxv/2,maxv];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Minutos por vez: de ${fm(list[0].minutes)} a ${fm(list[list.length-1].minutes)} en ${list.length} registros">
    ${ticks.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)} min</text>`).join("")}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--accent)"/>`).join("")}
    <circle cx="${last[0]}" cy="${last[1]}" r="5.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${m.l}" y="${H-8}">${esc(fmt(list[0].date))}</text><text x="${W-m.r}" y="${H-8}" text-anchor="end">${esc(fmt(list[list.length-1].date))}</text></svg>`;
}
function timeCard(t){
  const s=timeStats(t.id);
  if(!s)return `<div class="card"><h3>Tiempo por vez</h3><p class="muted small">Anota los minutos al registrar la tarea completa. Con dos registros o más verás aquí si el tiempo bajó.</p></div>`;
  const saved=s.first-s.last;
  return `<div class="card"><h3>Tiempo por vez</h3>
    <div class="grid2"><div class="stat"><span class="label">Primera vez</span><b>${fm(s.first)} min</b></div><div class="stat"><span class="label">Última vez</span><b>${fm(s.last)} min</b></div><div class="stat"><span class="label">Mejor tiempo</span><b>${fm(s.best)} min</b></div><div class="stat"><span class="label">Promedio</span><b>${fm(s.avg)} min</b></div></div>
    ${s.n>1?`<p>${saved>0?`Ahora tardas ${fm(saved)} min menos que la primera vez (${Math.abs(s.pct)} % menos).`:saved<0?`Ahora tardas ${fm(-saved)} min más que la primera vez. Revisa qué cambió en el proceso.`:"Tardas lo mismo que la primera vez."}</p>`:""}
    ${timeChart(s.list)}
    <p class="muted small">Solo cuentan los registros con la tarea completa. Cuanto más baja la línea, menos tiempo toma.</p></div>`;
}

/* ---------- vistas ---------- */
function render(){
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",(a.dataset.v===(view==="form"?"hoy":view))?"page":"false"));
  const m=$("#main");
  m.innerHTML=view==="form"?vForm():view==="tareas"?vTareas():view==="progreso"?vProgreso():view==="metodo"?vMetodo():vHoy();
  if(view==="form")bindForm();
}
function emptyState(){
  return `<div class="card">
    <h2>Empieza con una tarea pequeña</h2>
    <p class="muted">Una tarea es algo que repites: preparar una sesión, responder mensajes, escribir notas clínicas. Cada vez que la haces, anotas el cambio de 1% que probaste y si funcionó. Con 1% mejor cada día, el año cierra en 1,01<sup>365</sup> ≈ 37,8 veces.</p>
    <div class="example"><span class="label">Ejemplo (no es tuyo)</span>
      <b>Escribir la nota de cada sesión</b>
      <span class="muted small">Soy alguien que deja registro claro de su trabajo. · Después de despedir al paciente, abro la plantilla en mi escritorio. · Versión de 2 minutos: escribir solo la primera línea.</span>
      <span class="small">1% de hoy: <i>dejar la plantilla abierta desde la mañana para no buscarla.</i> → Muda detectada: movimiento.</span></div>
    <div class="row"><button class="primary" data-act="newtask">Crear mi primera tarea</button><button data-act="example">Cargar ejemplo: lavar los platos</button></div></div>`;
}
function vHoy(){
  const ts=act();
  const t0=today();
  const total=entries.filter(e=>e.status!=="skipped").length;
  const week=entries.filter(e=>e.date>addDays(t0,-7)&&e.status!=="skipped").length;
  let h=`<div class="row between"><div><span class="label">${esc(fmt(t0))}</span><h2>Hoy</h2></div></div>`;
  if(!ts.length)return h+emptyState();
  h+=`<div class="grid2"><div class="stat"><span class="label">Registros</span><b>${total}</b></div><div class="stat"><span class="label">Últimos 7 días</span><b>${week}</b></div></div>`;
  h+=ts.map(t=>{
    const es=eOf(t.id),last=es[es.length-1],doneToday=es.some(e=>e.date===t0),L=level(t.id),S=streak(t.id);
    let msg="";
    if(last&&last.status==="skipped"&&!doneToday)msg=`<div class="banner">${last.date===t0?"":"La última vez no la hiciste. "}Nunca falles dos veces: hoy haz al menos la versión de 2 minutos${t.mini?`: ${esc(t.mini)}`:""}.</div>`;
    return `<article class="card">
      <div class="row between"><h3>${esc(t.name)}</h3><span class="lvl" title="Nivel acumulado">${x(L)}</span></div>
      ${t.identity?`<p class="muted small">Soy alguien que ${esc(t.identity)}</p>`:""}
      ${t.stack||t.cue?`<p class="small"><b>Señal:</b> ${t.stack?`Después de ${esc(t.stack)}`:""}${t.stack&&t.cue?", ":""}${esc(t.cue||"")}</p>`:""}
      ${msg}
      ${timeLine(t.id)}
      <div class="small"><span class="label">Mi 1% de hoy</span><br>${last&&last.next?esc(last.next):`<span class="muted">Todavía no definido. Lo escribes al registrar.</span>`}</div>
      ${t.standards&&t.standards.length?`<div class="small"><span class="label">Mi estándar actual</span><ul class="plain">${t.standards.slice(-3).map(s=>`<li>${esc(s.text)}</li>`).join("")}</ul></div>`:""}
      <div class="row between"><div class="row"><span class="pill ${S?"good":""}">${S} ${S===1?"día":"días"} seguidos</span>${doneToday?`<span class="pill good">Registrada hoy</span>`:`<span class="pill warn">Pendiente</span>`}</div>
      <button class="primary" data-act="log" data-id="${t.id}">${doneToday?"Registrar otra vez":"Registrar"}</button></div>
    </article>`}).join("");
  return h;
}
function taskForm(t){
  t=t||{};
  const f=(id,l,hint,val,ph)=>`<label class="f" for="${id}">${l}${hint?`<small>${hint}</small>`:""}<input type="text" id="${id}" value="${esc(val||"")}" placeholder="${esc(ph||"")}"></label>`;
  return `<form class="card f" id="taskform" data-id="${esc(t.id||"")}">
    <h3>${t.id?"Editar tarea":"Nueva tarea"}</h3>
    ${f("tf-name","Nombre de la tarea","Algo que repites.",t.name,"Escribir la nota de cada sesión")}
    ${f("tf-identity","Soy alguien que…","Identidad que refuerza esta tarea.",t.identity,"deja registro claro de su trabajo")}
    ${f("tf-stack","Después de…","Hábito que ya tienes y funciona como señal.",t.stack,"despedir al paciente")}
    ${f("tf-cue","Haré… en… (cuándo y dónde)","Intención de implementación.",t.cue,"abrir la plantilla en mi escritorio")}
    ${f("tf-mini","Versión de 2 minutos","La forma más pequeña de empezar.",t.mini,"escribir solo la primera línea")}

function lineChart(t){
  const L=levels(t.id);
  if(L.length<2)return `<p class="muted small">Con dos registros o más aparece la curva de este nivel.</p>`;
  const W=640,H=230,m={l:46,r:16,t:14,b:30};
  const maxv=Math.max(1.02,...L.map(p=>p.v));const minv=1;
  const X=i=>m.l+(W-m.l-m.r)*(i/(L.length-1));
  const Y=v=>H-m.b-(H-m.t-m.b)*((v-minv)/(maxv-minv));
  const pts=L.map((p,i)=>[X(i),Y(p.v)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H-m.b} L${pts[0][0].toFixed(1)} ${H-m.b} Z`;
  const ticks=[minv,(minv+maxv)/2,maxv];
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Nivel acumulado de ${esc(t.name)}: de 1,000 a ${L[L.length-1].v.toFixed(3)} en ${L.length} registros">
    ${ticks.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(3)}</text>`).join("")}
    <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${m.l}" y="${H-8}">${esc(fmt(L[0].e.date))}</text><text x="${W-m.r}" y="${H-8}" text-anchor="end">${esc(fmt(L[L.length-1].e.date))}</text></svg>`;
}
function heat(){
  const t0=today();const dow=(parse(t0).getDay()+6)%7;
  const start=addDays(t0,-(11*7+dow));
  const cnt={};entries.filter(e=>e.status!=="skipped").forEach(e=>cnt[e.date]=(cnt[e.date]||0)+1);
  let c="";
  for(let i=0;i<12*7;i++){const d=addDays(start,i);if(d>t0){c+=`<i style="visibility:hidden"></i>`;continue}const n=Math.min(2,cnt[d]||0);c+=`<i data-n="${n}" title="${esc(fmt(d))}: ${cnt[d]||0} registros"></i>`}
  return `<div class="heat" role="img" aria-label="Actividad de las últimas 12 semanas">${c}</div><p class="muted small">Cada cuadro es un día; las filas van de lunes a domingo.</p>`;
}

  if(a==="example"){await loadExample()}
  else if(a==="savetask"){try{await saveTask()}catch(err){toast("No se pudo guardar: "+((err&&err.message)||err))}}
  else if(a==="savelog"){try{if(logSave)await logSave()}catch(err){toast("No se pudo guardar: "+((err&&err.message)||err))}}
  else if(a==="log"){formTask=id;view="form";confirmKey=null;render();window.scrollTo(0,0)}
  else if(a==="cancellog"){view="hoy";formTask=null;render()}
  else if(a==="newtask"){go("tareas");editTask=true;render();window.scrollTo(0,0)}
  else if(a==="canceltask"){editTask=null;render()}
  else if(a==="edit"){editTask=id;render();window.scrollTo(0,0)}
  else if(a==="archive"){const t=tasks.find(t=>t.id===id);t.archived=!t.archived;render();await put("tareas",t)}
  else if(a==="deltask"){
    if(confirmKey!=="t"+id){confirmKey="t"+id;render();return}
    confirmKey=null;const es=entries.filter(e=>e.taskId===id);
    tasks=tasks.filter(t=>t.id!==id);entries=entries.filter(e=>e.taskId!==id);render();
    await del("tareas",id);for(const en of es)await del("entradas",en.id);toast("Tarea borrada")}
  else if(a==="delentry"){
    if(confirmKey!=="e"+id){confirmKey="e"+id;render();return}
    confirmKey=null;entries=entries.filter(e=>e.id!==id);render();await del("entradas",id)}
});
document.addEventListener("change",e=>{
  if(e.target.id==="pt"){chartTask=e.target.value;render()}
  if(e.target.dataset&&e.target.dataset.act==="arch0"){showArchived=false;render()}
  if(e.target.dataset&&e.target.dataset.act==="arch1"){showArchived=true;render()}
});
async function saveTask(){
  const form=$("#taskform");if(!form)return;
  const g=i=>$("#"+i).value.trim();
  const name=g("tf-name");
  if(!name){$("#tf-name").focus();toast("Escribe el nombre de la tarea");return}
  const id=form.dataset.id;
  let t=id?tasks.find(t=>t.id===id):null;
  if(!t){t={id:uid(),createdAt:Date.now(),standards:[],archived:false};tasks.push(t)}
  Object.assign(t,{name,identity:g("tf-identity"),stack:g("tf-stack"),cue:g("tf-cue"),mini:g("tf-mini"),reward:g("tf-reward")});
  editTask=null;render();toast("Tarea guardada");await put("tareas",t);
}
document.addEventListener("submit",e=>{e.preventDefault()});
const VIEWS=["hoy","tareas","progreso","metodo"];
function go(v){
  view=v;formTask=null;editTask=null;confirmKey=null;
  try{history.replaceState(null,"","#"+v)}catch(e){}
}
document.getElementById("tabs").addEventListener("click",e=>{
  const a=e.target.closest("a[data-v]");if(!a)return;
  e.preventDefault();go(a.dataset.v);render();window.scrollTo(0,0);
});
window.addEventListener("hashchange",()=>{
  const h=(location.hash||"").slice(1);
  if(VIEWS.includes(h)&&h!==view){go(h);render()}
});
view=["hoy","tareas","progreso","metodo"].includes((location.hash||"").slice(1))?(location.hash).slice(1):"hoy";
boot();
})();
</script>
